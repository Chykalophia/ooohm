name: ooohm

x-app-env: &app-env
  DATABASE_URL: postgres://ooohm:${POSTGRES_PASSWORD:-ooohm}@db:5432/ooohm
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-OOOhm <no-reply@ooohm.team>}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ooohm
      POSTGRES_USER: ooohm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ooohm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ooohm -d ooohm"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs migrations and the first-run seed, then exits.
  migrate:
    build:
      context: .
      target: builder
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Catches every outgoing email in development. Open http://localhost:8025
  # Remove this service in production and point SMTP_* at a real mail server.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  pgdata:
