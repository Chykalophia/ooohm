name: ooohm

# POSTGRES_PASSWORD is placed inside a URL below, so keep it URL-safe
# (letters, digits, - _ . ~). `openssl rand -hex 24` makes a good one.
x-app-env: &app-env
  DATABASE_URL: postgres://ooohm:${POSTGRES_PASSWORD:-ooohm}@db:5432/ooohm
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  # Mailpit offers no STARTTLS; a real provider needs this on (see .env.production.example).
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-OOOhm <no-reply@ooohm.team>}
  # smtp (above) or sendgrid; see .env.example.
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  SENDGRID_REGION: ${SENDGRID_REGION:-global}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  WEBHOOK_ALLOW_INSECURE: ${WEBHOOK_ALLOW_INSECURE:-false}
  WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The `worker` service below delivers webhooks and runs the daily jobs.
  OOOHM_BACKGROUND: worker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ooohm
      POSTGRES_USER: ooohm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ooohm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Localhost only, so `pnpm dev` on the host can reach it. Set DB_PORT if 5432 is taken.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ooohm -d ooohm"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs migrations, the first-run seed and the (idempotent) year rollover, then exits.
  # A failed rollover is reported but does not stop the app from starting: balances
  # still work without it, only carryover waits. Re-run it with
  # `docker compose run --rm migrate pnpm job:rollover [year]`.
  migrate:
    build:
      context: .
      target: builder
    command:
      - sh
      - -c
      - pnpm db:migrate && pnpm db:seed && { pnpm job:rollover || echo "Year rollover failed (see above); the app starts anyway." >&2; }
    # Only what migrations, the seed and the rollover need; no auth secret or OAuth credentials.
    environment:
      DATABASE_URL: postgres://ooohm:${POSTGRES_PASSWORD:-ooohm}@db:5432/ooohm
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The outbox worker: dispatches events to webhooks (and adapters, none in v1), delivers
  # them with retries, and runs the daily year rollover and retention. It gets only the
  # database, the webhook encryption key and its own settings: never the auth secret,
  # OAuth or SMTP credentials. Safe to scale (`--scale worker=2`): claims use SKIP LOCKED.
  worker:
    build:
      context: .
      target: builder
    # tsx directly (not pnpm) so SIGTERM reaches the worker, which finishes in-flight
    # deliveries before exiting; init reaps the child.
    command: ["node_modules/.bin/tsx", "--conditions=react-server", "scripts/worker.mts"]
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    # The one process that talks to admin-chosen hosts runs unprivileged (the image's
    # `node` user), on a read-only filesystem with no capabilities; tsx caches in /tmp.
    user: node
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgres://ooohm:${POSTGRES_PASSWORD:-ooohm}@db:5432/ooohm
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      WEBHOOK_ALLOW_INSECURE: ${WEBHOOK_ALLOW_INSECURE:-false}
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_MAX_IDLE_MS: ${WORKER_MAX_IDLE_MS:-10000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Catches every outgoing email in development. Open http://localhost:8025
  # Remove this service in production and point SMTP_* at a real mail server.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      # Localhost only: the inbox holds live sign-in links and has no login.
      - "127.0.0.1:8025:8025"
      # SMTP, for `pnpm dev` on the host (SMTP_HOST empty = localhost:1025).
      - "127.0.0.1:1025:1025"

volumes:
  pgdata:
