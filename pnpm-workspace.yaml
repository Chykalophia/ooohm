ignoredBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Overrides for dev tooling with no fixed upstream release yet:
# - drizzle-kit 0.31.x still declares @esbuild-kit/esm-loader (and through it
#   @esbuild-kit/core-utils), both deprecated, which also pinned esbuild ~0.18
#   (GHSA-67mh-4wv8-2f99). drizzle-kit no longer uses them: it loads
#   drizzle.config.ts through its bundled tsx register, and its build never
#   requires or imports either package. "-" drops the dependency for drizzle-kit
#   only. Remove this once a stable drizzle-kit stops declaring it (the 1.0
#   release candidates already declare no dependencies).
# - @typescript-eslint/typescript-estree takes minimatch ^10, affected by
#   GHSA-g3hv-75wg-m249. It only uses the named `minimatch` export, which 11 keeps.
# Remove each once the upstream package depends on a fixed version.
overrides:
  "drizzle-kit>@esbuild-kit/esm-loader": "-"
  "minimatch@^10": "^11.0.4"
