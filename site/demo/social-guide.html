<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OOOhm on LinkedIn: the product guide (composition)</title>
<!-- 4:5 LinkedIn cut, about 26 s, cut to the beat of "Wallpaper" (about 92 BPM): every screen,
     every setting, every email, then the guide itself. Run prep-guide-film.mjs first: it captures
     the guide page and mixes the sound effects into the music. -->
<link rel="stylesheet" href="social/social.css">
<style>
  .kicker-top { position: absolute; left: 72px; top: 64px; font-size: 30px; font-weight: 600; color: var(--accent); letter-spacing: .01em; display: flex; align-items: center; gap: 12px; }
  .kicker-top i { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  .big { position: absolute; left: 72px; right: 72px; top: 118px; font-size: 104px; line-height: 1; letter-spacing: -0.05em; font-weight: 600; }
  .big .a { color: var(--accent); }

  .pile { position: absolute; left: 0; right: 0; top: 330px; height: 820px; }
  .card { position: absolute; left: 50%; top: 0; width: 920px; height: 700px; margin-left: -460px; background: #fff; border: 1.5px solid var(--border); border-radius: 26px; overflow: hidden; opacity: 0;
    box-shadow: 0 2px 4px rgba(28,25,23,.05), 0 50px 90px -40px rgba(28,25,23,.35); }
  /* Desktop shots are zoomed onto their centred content so the words read on a phone. */
  .card img { display: block; width: 130%; margin-left: -15%; }
  .card.mail { width: 860px; margin-left: -430px; height: auto; max-height: 760px; }
  .card.mail img { width: 100%; margin-left: 0; }

  .count { position: absolute; right: 72px; top: 118px; font-size: 104px; line-height: 1; font-weight: 600; letter-spacing: -0.05em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .count small { font-size: 44px; color: var(--muted); letter-spacing: -0.02em; }

  .browser { position: absolute; left: 50%; top: 300px; width: 960px; height: 860px; translate: -50% 0; background: #fff; border: 1.5px solid var(--border); border-radius: 24px; overflow: hidden;
    box-shadow: 0 2px 4px rgba(28,25,23,.05), 0 50px 90px -40px rgba(28,25,23,.35); }
  .browser .view { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .browser .view img { position: absolute; left: 0; top: 0; width: 100%; }

  .stats { position: absolute; left: 72px; right: 72px; top: 300px; display: grid; gap: 34px; }
  .stat { display: flex; align-items: baseline; gap: 26px; opacity: 0; }
  .stat b { font-size: 190px; font-weight: 600; letter-spacing: -0.06em; line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 380px; text-align: right; }
  .stat span { font-size: 64px; font-weight: 600; letter-spacing: -0.035em; }

  .end .title { font-size: 64px; font-weight: 600; letter-spacing: -0.04em; margin-top: 30px; }
  .end .url { margin-top: 22px; display: inline-block; font: 500 40px/1 "JetBrains Mono", monospace; color: var(--accent); background: var(--soft); border-radius: 16px; padding: 18px 28px; box-shadow: inset 0 -4px 0 var(--line); }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0f766e"/><g transform="translate(3.52 3.52) scale(0.78)"><path d="M7.5 24.5H12.6V21.2A7.5 7.5 0 1 1 19.4 21.2V24.5H24.5" fill="none" stroke="#fff" stroke-width="3.1" stroke-linejoin="round"/></g></symbol></svg>

  <p class="kicker-top" id="kicker"><i></i>New: the OOOhm guide</p>

  <section class="scene" id="s-screens">
    <h1 class="big">Every <span class="a">screen.</span></h1>
    <div class="pile" id="p-screens"></div>
  </section>

  <section class="scene" id="s-settings">
    <h1 class="big">Every <span class="a">setting.</span></h1>
    <div class="pile" id="p-settings"></div>
  </section>

  <section class="scene" id="s-emails">
    <h1 class="big">Every <span class="a">email.</span></h1>
    <p class="count" id="count">1<small>/12</small></p>
    <div class="pile" id="p-emails"></div>
  </section>

  <section class="scene" id="s-guide">
    <h1 class="head">One guide, <span class="a">with real screenshots.</span></h1>
    <div class="browser"><div class="bar"><i></i><i></i><i></i><span class="addr" id="addr"></span></div><div class="view"><img id="page" src=".frames/guide-assets/asking-for-time-off.jpg" alt=""></div></div>
  </section>

  <section class="scene" id="s-stats">
    <h1 class="head">Everything, <span class="a">written down.</span></h1>
    <div class="stats">
      <p class="stat" id="st1"><b>14</b><span>pages</span></p>
      <p class="stat" id="st2"><b>60+</b><span>screenshots</span></p>
      <p class="stat" id="st3"><b>12</b><span>emails</span></p>
    </div>
  </section>

  <section class="scene center end" id="s-end">
    <div>
      <div class="logo"><svg><use href="#mark"/></svg><span><span class="o">OOO</span><span class="hm">hm</span></span></div>
      <p class="title">The guide is live.</p>
      <p class="url" id="url"></p>
      <div class="facts"><span>Free</span><span>Source-available</span><span>Self-hosted</span></div>
      <p class="cta">Link in the first comment</p>
    </div>
  </section>

  <div class="flash" id="flash"></div>
  <p class="caption" id="caption"></p>

<script src="social/social.js"></script>
<script>
  window.SIZE = { w: 1080, h: 1350 };
  window.CLIPS = [];
  // Wallpaper runs at about 92 BPM: a beat every 0.65 s, the first at 0.24 s.
  const BEAT = 60 / 92.3, B0 = 0.244;
  const b = (n) => B0 + n * BEAT;
  window.DURATION = 26.5;
  window.POSTER = 0;
  // Beats where something lands, for the sound effects (prep-guide-film.mjs reads these).
  window.HITS = { whoosh: [6, 12, 18, 26, 32].map(b), tick: [], pop: [], ding: [b(33)] };

  window.CAPTIONS = [
    { at: 0, end: b(6) - 0.05, text: "We wrote down how OOOhm works. All of it." },
    { at: b(6), end: b(12) - 0.05, text: "Every setting, with what it does and its default." },
    { at: b(12), end: b(18) - 0.05, text: "Every email: who gets it, when, and what it says." },
    { at: b(18), end: b(26) - 0.05, text: "Each page has real screenshots from the app." },
    { at: b(26), end: b(32) - 0.05, text: "So your team never has to ask how it works." },
    { at: b(32), end: 26.4, text: "Read it now. The link is in the first comment." },
  ];

  const SCREENS = ["home", "calendar-month", "approvals", "reports", "team", "calendar-year"];
  const SETTINGS = ["admin-company", "admin-appearance", "admin-departments", "admin-leave-type", "admin-holidays", "admin-people"];
  const EMAILS = ["requested", "approved", "rejected", "booked", "heads-up", "added", "removed", "cancelled-requester", "cancelled-approver", "recounted"].map((k) => `email-leave-${k}`).concat(["email-invite", "email-sign-in"]);

  /** A pile of cards, each landing at its time with a small turn, the newest on top. */
  function pile(id, names, cls, startBeat, step) {
    const host = $(id);
    return names.map((n, i) => {
      const el = document.createElement("div");
      el.className = `card ${cls}`;
      el.innerHTML = `<img src="../docs/images/${n}.webp" alt="">`;
      host.append(el);
      return { el, at: b(startBeat + i * step), rot: (i % 2 ? 1 : -1) * (1.2 + (i % 3) * 0.7), dx: ((i % 3) - 1) * 14 };
    });
  }
  const piles = [
    pile("p-screens", SCREENS, "", 0, 1),
    pile("p-settings", SETTINGS, "", 6, 1),
    pile("p-emails", EMAILS, "mail", 12, 0.5),
  ];
  // Every card is a tick; the first of each pile comes in with the whoosh instead.
  piles.forEach((p) => p.slice(1).forEach((c) => window.HITS.tick.push(c.at)));
  // The scene starts on screen, so the first card is already there at the first frame.
  piles[0][0].at = -1;

  function drawPile(cards, t) {
    for (const c of cards) {
      const k = ramp(t, c.at, c.at + 0.2, out);
      c.el.style.opacity = t >= c.at ? 1 : 0;
      const s = 1.14 - 0.14 * k;
      c.el.style.transform = `translate(${c.dx}px, ${(1 - k) * 40}px) rotate(${c.rot * k}deg) scale(${s})`;
    }
  }

  $("url").textContent = `${URL_TEXT}/docs`;
  $("addr").textContent = `${URL_TEXT}/docs/asking-for-time-off`;
  const stats = [["st1", b(27)], ["st2", b(28)], ["st3", b(29)]];
  stats.forEach(([, at]) => window.HITS.pop.push(at));

  window.seek = async function seek(t) {
    $("kicker").style.opacity = 1 - ramp(t, b(17.6), b(18));

    $("s-screens").style.opacity = shown(t, 0, b(6), 0.12);
    drawPile(piles[0], t);
    $("s-settings").style.opacity = shown(t, b(6), b(12), 0.12);
    drawPile(piles[1], t);
    $("s-emails").style.opacity = shown(t, b(12), b(18), 0.12);
    drawPile(piles[2], t);
    const shownMails = piles[2].filter((c) => t >= c.at).length;
    $("count").firstChild.textContent = String(Math.max(1, shownMails));
    $("count").style.transform = `scale(${1 + 0.12 * (1 - ramp(t, piles[2][Math.max(0, shownMails - 1)].at, piles[2][Math.max(0, shownMails - 1)].at + 0.18))})`;

    // The guide itself: the page scrolls past its screenshots, a beat at a time.
    $("s-guide").style.opacity = shown(t, b(18), b(26), 0.15);
    const img = $("page");
    const travel = Math.max(0, img.getBoundingClientRect().height - 814);
    let y = 0;
    for (let i = 0; i < 6; i++) y += ramp(t, b(19 + i), b(19.7 + i));
    img.style.transform = `translateY(${-Math.min(travel, (travel * 0.62) * y / 6)}px)`;
    $("s-guide").querySelector(".browser").style.transform = `translateY(${30 * (1 - ramp(t, b(18), b(18.6), out))}px)`;

    // The numbers, one per beat.
    $("s-stats").style.opacity = shown(t, b(26), b(32), 0.15);
    for (const [id, at] of stats) { const k = ramp(t, at, at + 0.22, out); set($(id), k, 40 * (1 - k), 0.9 + 0.1 * k); }

    // End card.
    $("s-end").style.opacity = ramp(t, b(32), b(32) + 0.25);
    $("s-end").firstElementChild.style.transform = `translateY(${16 * (1 - ramp(t, b(32), b(33), out))}px)`;

    // A white flash on each scene change, short enough to read as a cut.
    $("flash").style.opacity = Math.max(0, ...[6, 12, 18, 26, 32].map((n) => 0.55 * (1 - ramp(t, b(n), b(n) + 0.16)) * (t >= b(n) ? 1 : 0)));

    drawCaption(t);
  };
  window.ready = readyAll();
</script>
</body>
</html>
